<div id="viewUsuarios" class="users-section">
    <div class="section-header-bar">
        <div>
            <h2 style="font-size: 20px; font-weight: 700; color:#0f172a;">Administración de Usuarios y Roles</h2>
            <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
                <span id="serverStatusBadge" class="server-status-pill offline">● Conectando...</span>
                <span style="font-size: 12.5px; color:#64748b;">Base de datos PostgreSQL: <strong>Aceros_Arequipa</strong></span>
            </div>
        </div>
        <button class="btn-primary" onclick="openNewUserModal()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nueva Cuenta
        </button>
    </div>

    <div id="noticeBanner" style="display:none; background:#eff6ff; border-left:4px solid #3b82f6; padding:12px 16px; margin-bottom:16px; border-radius:4px; font-size:12.5px; color:#1e40af;">
    </div>

    <div class="users-table-wrap">
        <table class="users-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre Completo</th>
                    <th>Correo / Usuario</th>
                    <th>Rol Asignado</th>
                    <th>Código / Teléfono</th>
                    <th>Estado</th>
                    <th style="text-align: right;">Acciones</th>
                </tr>
            </thead>
            <tbody id="usersTbody">
                <!-- Filas dinámicas -->
            </tbody>
        </table>
    </div>

    <!-- MODAL: CREAR / EDITAR USUARIO -->
    <div class="edit-modal-overlay" id="userModal">
        <div class="edit-modal-box">
            <div class="edit-modal-header">
                <h3 id="modalTitle" style="font-size: 15px; font-weight: 700;">Registrar Nueva Cuenta</h3>
                <button onclick="closeUserModal()" style="background:transparent; border:none; color:#ffffff; font-size:18px; cursor:pointer;">&times;</button>
            </div>
            <div class="edit-modal-body">
                <form id="userForm" onsubmit="saveUser(event)">
                    <input type="hidden" id="formUserId">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                        <div class="form-field">
                            <label>Nombres *</label>
                            <input type="text" id="formNombres" required placeholder="Ej. Carlos" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,50}" title="Ingrese un nombre válido">
                        </div>
                        <div class="form-field">
                            <label>Apellidos *</label>
                            <input type="text" id="formApellidos" required placeholder="Ej. Mendoza" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,50}" title="Ingrese un apellido válido">
                        </div>
                    </div>

                    <div class="form-field" style="margin-bottom: 12px;">
                        <label>Correo Electrónico (Login) *</label>
                        <input type="email" id="formEmail" required placeholder="usuario@acerosarequipa.com">
                    </div>

                    <div class="form-field" style="margin-bottom: 12px;">
                        <label>Contraseña *</label>
                        <input type="password" id="formPassword" placeholder="••••••••">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
                        <div class="form-field">
                            <label>Rol Asignado *</label>
                            <select id="formRol" required>
                                <option value="ADMINISTRADOR">👑 Administrador</option>
                                <option value="SUPERVISOR">📋 Supervisor (Flotas y Rutas)</option>
                                <option value="CONDUCTOR">🚚 Transportista (Conductor)</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Teléfono</label>
                            <input type="text" id="formTelefono" placeholder="987654321">
                        </div>
                    </div>

                    <div class="form-field" style="margin-bottom: 16px;">
                        <label>Código de Empleado</label>
                        <input type="text" id="formCodEmpleado" placeholder="EMP-2026-01">
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" onclick="closeUserModal()" style="padding: 8px 16px; border:1px solid #cbd5e1; background:#f8fafc; border-radius:4px; cursor:pointer;">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar en Base de Datos</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
